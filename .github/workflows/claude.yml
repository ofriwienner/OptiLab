name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --max-turns 40
            --dangerously-skip-permissions
          prompt: |
            You are working on OptiLab, a static HTML/JS optical bench simulator.
            No build step - open index.html directly in a browser. All source is in js/ and styles/.

            Key files:
            - js/config.js - all global state variables and constants
            - js/element.js - Element class, component types, ray-tracing segments
            - js/input.js - all mouse/keyboard event handlers
            - js/renderer.js - all canvas drawing functions
            - js/state.js - save/load/undo/redo
            - js/ui/controls.js - dynamic sidebar UI panel
            - js/physics/raytracing.js - ray casting and beam physics
            - js/physics/optics.js - Mueller matrix optics

            Coding rules:
            - No comments unless the why is non-obvious
            - No build tools, plain JS, no imports, everything global
            - Tailwind CSS classes for UI (loaded via CDN)
            - State lives in config.js as let globals
            - saveToHistory() before any mutation that should be undoable
            - draw() after any state change that affects visuals
            - updateUI() after selection changes
            - Clone elements: rehydrateElement(JSON.parse(JSON.stringify(el)))

            Commit messages (max 72 chars, imperative mood, no articles, no trailing period).
            Example: "Add inline name editing on double-click"

            ---

            **IF YOU ARE WORKING ON A GITHUB ISSUE** (someone tagged @claude on an issue to implement it):

            1. Mark it as claimed: gh issue edit ${{ github.event.issue.number }} --add-label claimed --remove-label pending
            2. Read CLAUDE.md for full context.
            3. Read the relevant source files.
            4. Create a feature branch: git checkout -b feat/${{ github.event.issue.number }}-<2-3-word-slug>
            5. Implement the feature.
            6. Commit your changes.
            7. Push: git push origin feat/${{ github.event.issue.number }}-<slug>
            8. Create a PR:
               gh pr create \
                 --title "<feature title>" \
                 --label "ready-for-review" \
                 --head "feat/${{ github.event.issue.number }}-<slug>" \
                 --body "## Description

            <what to test and what correct behavior looks like>

            Closes #${{ github.event.issue.number }}"

            **IF YOU ARE WORKING ON A PR** (someone tagged @claude on a PR comment or review):

            1. Read the comment/review to understand what's being asked.
            2. Read the relevant source files.
            3. Make the requested changes and commit. NEVER amend, NEVER force-push.
            4. Push to the existing PR branch - do NOT create a new PR.
            5. Reply with a brief summary of what you changed.
